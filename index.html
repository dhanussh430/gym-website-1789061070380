  <nav class="main-nav">

    

        <a
          href="#hero"
          class="nav-link"
          data-slide="hero">

          Welcome

        </a>

      

        <a
          href="#about"
          class="nav-link"
          data-slide="about">

          About Us

        </a>

      

        <a
          href="#services"
          class="nav-link"
          data-slide="services">

          Our Services

        </a>

      

        <a
          href="#gallery"
          class="nav-link"
          data-slide="gallery">

          Gallery

        </a>

      

        <a
          href="#contact-us"
          class="nav-link"
          data-slide="contact-us">

          Contact Us

        </a>

      

  </nav>

</header>


<main>

  

<section
  id="hero"
  class="site-slide hero-slide"
  data-index="0">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        01
      </span>

      <h2>
        Welcome
      </h2>

      
            <p>
              Discover something amazing.
            </p>
          

      
            <button
              class="primary-btn"
              data-next>

              Explore More
              <span>→</span>

            </button>
          

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/38872716/pexels-photo-38872716.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="Inspiring gym setting featuring &#039;No Pain No Gain&#039; wall art with exercise ball and equipment."
              loading="eager"
            >

          </div>

        


  </div>


  


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="about"
  class="site-slide content-slide"
  data-index="1">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        02
      </span>

      <h2>
        About Us
      </h2>

      
            <p>
              Learn more about our business.
            </p>
          

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/13106621/pexels-photo-13106621.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="A large group of diverse adults smiling and posing together in a gym setting."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="services"
  class="site-slide content-slide"
  data-index="2">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        03
      </span>

      <h2>
        Our Services
      </h2>

      
            <p>
              Explore what we offer.
            </p>
          

      

    </div>


    

          <div class="visual-placeholder">

            <div class="placeholder-icon">
              ✦
            </div>

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="gallery"
  class="site-slide content-slide"
  data-index="3">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        04
      </span>

      <h2>
        Gallery
      </h2>

      
            <p>
              Take a look at our work.
            </p>
          

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/38872716/pexels-photo-38872716.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="Inspiring gym setting featuring &#039;No Pain No Gain&#039; wall art with exercise ball and equipment."

            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="contact-us"
  class="site-slide content-slide"
  data-index="4">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        05
      </span>

      <h2>
        Contact Us
      </h2>

      
            <p>
              Get in touch with us.
            </p>
          

      

    </div>


    

          <div class="visual-placeholder">

            <div class="placeholder-icon">
              ✦
            </div>

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

</section>

        

</main>


<div class="slide-dots">

  

        <button
          class="dot active"
          data-target="hero"
          aria-label="Go to Welcome">
        </button>

      

        <button
          class="dot "
          data-target="about"
          aria-label="Go to About Us">
        </button>

      

        <button
          class="dot "
          data-target="services"
          aria-label="Go to Our Services">
        </button>

      

        <button
          class="dot "
          data-target="gallery"
          aria-label="Go to Gallery">
        </button>

      

        <button
          class="dot "
          data-target="contact-us"
          aria-label="Go to Contact Us">
        </button>

      

</div>


<footer class="site-footer">

  

<div class="footer-contact">

  

  

  

  

</div>

  </p>

</html>
